name: Refresh CORE rankings

# CORE only re-ranks conferences every few years, so this just needs to run
# occasionally to pick up corrections or a new ranking round.
on:
  schedule:
    - cron: "0 4 1 * *" # monthly
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_core_rankings.py
      - run: |
          if ! git diff --quiet -- data/core_rankings.csv; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/core_rankings.csv
            git commit -m "Refresh CORE ranking export"
            git push
          else
            echo "No changes to CORE rankings."
          fi
